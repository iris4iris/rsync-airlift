name: Publish APT repository

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Debian version, increasing for every publication (for example 0.1.0)'
        required: true
        type: string

# Actions are pinned to full commit SHAs (tag in the comment); update both together.
permissions:
  contents: read

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate version
        env:
          DEB_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, re
          if not re.fullmatch(r'[0-9][A-Za-z0-9.+~\-]*', os.environ['DEB_VERSION']):
              raise SystemExit('Invalid Debian version')
          PY
      - name: Check repository generator
        run: python -m unittest discover -s tools -p 'test_*.py'
      # The signed package is built by the wrapper JAR committed in this repository.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test Linux Native
        run: bash ./gradlew -PenableLinuxNative=true :core:linuxX64Test :monitor:linuxX64Test :monitor:linkReleaseExecutableLinuxX64
      - name: Package and installation smoke test
        env:
          DEB_VERSION: ${{ inputs.version }}
        run: |
          python tools/package_native.py --version "$DEB_VERSION"
          sudo apt-get update
          sudo apt-get install -y ./monitor/build/native-release/*.deb
          rsync-airlift --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-release
          path: monitor/build/native-release/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-22.04
    environment: apt-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-release
          path: packages
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: Import signing key and build repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/airlift-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent || true; rm -rf -- "$GNUPGHOME"; rm -f -- "$RUNNER_TEMP/airlift-passphrase"' EXIT
          test -n "$APT_SIGNING_KEY"
          test -n "$APT_SIGNING_FINGERPRINT"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          (umask 077; printf '%s' "$APT_SIGNING_PASSPHRASE" > "$RUNNER_TEMP/airlift-passphrase")
          unset APT_SIGNING_KEY APT_SIGNING_PASSPHRASE
          python tools/build_apt_repository.py --packages packages --output public \
            --sign-key "$APT_SIGNING_FINGERPRINT" --passphrase-file "$RUNNER_TEMP/airlift-passphrase"
      - name: Verify APT accepts the signed repository
        run: |
          sudo install -m 644 public/rsync-airlift-archive-keyring.gpg /usr/share/keyrings/airlift-ci.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/airlift-ci.gpg] file:$GITHUB_WORKSPACE/public stable main" | sudo tee /etc/apt/sources.list.d/airlift-ci.list
          sudo apt-get update -o APT::Update::Error-Mode=any
          apt-cache policy rsync-airlift
          sudo apt-get install --download-only -y rsync-airlift
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: public

  deploy:
    needs: sign
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy repository
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
